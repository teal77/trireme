plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// The release key lives in android/key.properties, which is gitignored and so
// is absent in every fresh clone and on any CI runner that has not been given
// the secrets. Without it the github flavor falls back to the debug key, and
// because a debug keystore is generated on demand, an ephemeral runner
// produces a different key on every build -- Android then refuses to install
// the new APK over the old one, and the only way through is to uninstall,
// which destroys the server list and every preference. Builds signed that way
// must not be published.
def releaseKeyPropertiesFile = rootProject.file('key.properties')
def hasReleaseKey = releaseKeyPropertiesFile.exists()

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace "org.deluge.trireme"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "org.deluge.trireme"
        // Pinned deliberately. This was flutter.minSdkVersion, which resolves
        // to 19 on Flutter 3.16 and 24 on 3.44 — so the app's minimum Android
        // version silently tracked whoever built it. API 24 is Android 7.0.
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 30
        versionName "1.4.5-beta.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        github {
            def keystoreProperties = new Properties()

            if (!hasReleaseKey) return

            releaseKeyPropertiesFile.withReader('UTF-8') { reader ->
                keystoreProperties.load(reader)
            }

            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
        unsigned {
            keyAlias = ""
            keyPassword = ""
            storePassword = ""
        }
    }

    flavorDimensions "deploy"

    productFlavors {
        github {
            dimension "deploy"
            signingConfig hasReleaseKey ? signingConfigs.github : signingConfigs.debug
        }

        fdroid {
            dimension "deploy"

        }
    }

    android.applicationVariants.all { variant ->
        if (variant.flavorName == "fdroid") {
            variant.outputs.all { output ->
                output.outputFileName = "app-fdroid-release.apk"
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.core:core:1.7.0'
}

// Say out loud which key a release build was signed with. A debug-signed
// release looks identical to a properly signed one until someone tries to
// upgrade and Android rejects it.
gradle.taskGraph.whenReady { graph ->
    def buildingGithubRelease = graph.allTasks.any {
        it.name.toLowerCase().contains('githubrelease')
    }
    if (!buildingGithubRelease) return

    if (hasReleaseKey) {
        logger.lifecycle('Signing the github release with the key from android/key.properties')
    } else {
        logger.warn('WARNING: android/key.properties is missing, so this release is signed with the debug key.')
        logger.warn('WARNING: it cannot be installed over an APK signed with a different key. Do not publish it.')
    }
}
