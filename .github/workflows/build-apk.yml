name: Build Android APK

on:
  push:
    branches:
      - beta
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must stay >= 3.27, which is the lowest stable bundling Dart 3.6 —
          # trireme_client v1.4.0 declares sdk: ">=3.6.0 <4.0.0" and a git
          # dependency resolves to exactly one version, so pub cannot fall back.
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Infos are not fatal: there is a standing backlog of ~62, mostly const
      # and widget-key lints. Warnings ARE fatal — this branch drove them to
      # zero, and letting them back in silently is how the backlog regrew last
      # time. Errors are always fatal.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --flavor github

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: trireme-release-apk
          path: build/app/outputs/flutter-apk/app-github-release.apk
